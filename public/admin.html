<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Spirit AI Admin</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 ใส่ Firebase Config ของคุณ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadGroups() {

  const container = document.getElementById("groups");
  container.innerHTML = "กำลังโหลด...";

  const snapshot = await getDocs(collection(db, "groups"));

  if (snapshot.empty) {
    container.innerHTML = "ยังไม่มีข้อมูลกลุ่ม";
    return;
  }

  container.innerHTML = "";

  snapshot.forEach(docSnap => {

    const data = docSnap.data();
    const groupId = docSnap.id;
    const modules = data.modules || {};

    const card = document.createElement("div");
    card.className = "card";

    let html = `<h3>📌 ${groupId}</h3>`;
    html += `<p><strong>Type:</strong> ${data.type || "-"}</p>`;
    html += "<ul>";

    Object.keys(modules).forEach(key => {
      html += `
        <li>
          ${key} :
          <strong style="color:${modules[key] ? "green" : "red"}">
            ${modules[key] ? "เปิด" : "ปิด"}
          </strong>
        </li>
      `;
    });

    html += "</ul>";

    html += `
      <button onclick="deleteGroup('${groupId}')">
        ลบกลุ่มนี้
      </button>
    `;

    card.innerHTML = html;
    container.appendChild(card);
  });
}

window.deleteGroup = async function(groupId) {

  if (!confirm("ต้องการลบกลุ่มนี้จริงหรือไม่?")) return;

  await deleteDoc(doc(db, "groups", groupId));
  alert("ลบเรียบร้อยแล้ว");
  loadGroups();
}

window.onload = loadGroups;

</script>

<style>
body {
  font-family: Arial;
  background:#f4f4f4;
  padding:20px;
}
.card {
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
button {
  padding:6px 12px;
  cursor:pointer;
}
</style>

</head>
<body>

<h1>🤖 Spirit AI Admin Panel</h1>
<button onclick="loadGroups()">รีเฟรช</button>
<div id="groups"></div>

</body>
</html>
